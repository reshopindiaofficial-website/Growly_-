<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e9e5b">
<title>Growly 🌱 – छोटे क्रिएटर्स का पहला सहारा</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8f2;--card:#fff;--ink:#16301f;--mute:#5b7263;--line:#dbe8dc;--g:#2e9e5b;--gd:#1f7a43;--gl:#e1f3e7;--warn:#d9822b;--warnbg:#fdf0e1;--red:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a13;--card:#17251c;--ink:#e6f2e9;--mute:#9bb3a2;--line:#27402f;--g:#4cc27e;--gd:#6fd99a;--gl:#1d3a28;--warn:#f0a050;--warnbg:#3a2a16;--red:#ff7b6b}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Hind,"Noto Sans Devanagari",system-ui,sans-serif;font-size:17px;line-height:1.5}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header{margin-top:calc(-1*env(safe-area-inset-top))}
.logo{font-size:24px;font-weight:700;color:var(--gd)}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font-size:22px;margin:4px 0 4px}
.sub{color:var(--mute);margin:0 0 14px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;min-height:48px;background:var(--g);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover,.btn:hover{background:var(--gd)}
.ghost{background:transparent;color:var(--gd);border:1.5px solid var(--g)}
.ghost:hover{background:var(--gl)}
.tiny{min-height:36px;padding:6px 12px;font-size:15px}
.link{background:none;color:var(--mute);min-height:32px;padding:4px 6px;font-weight:500;font-size:14px}
.link:hover{background:none;color:var(--red)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.big{width:100%;margin-bottom:14px;font-size:18px;min-height:54px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--g);border-radius:14px;padding:14px;margin-bottom:12px}
.card.need{border-left-color:var(--warn)}
.card.mine{border-left-color:var(--mute)}
.card h3{margin:0 0 2px;font-size:18px;line-height:1.35;word-break:break-word}
.meta{color:var(--mute);font-size:15px;margin:0 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--gl);color:var(--gd);border-radius:99px;padding:2px 12px;font-size:14px;font-weight:600}
.chip.w{background:var(--warnbg);color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:30px;color:var(--gd)}
.empty{text-align:center;color:var(--mute);padding:36px 12px;border:2px dashed var(--line);border-radius:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav a{flex:1;text-align:center;padding:10px 4px;color:var(--mute);text-decoration:none;font-size:13px;font-weight:600}
nav a span{display:block;font-size:22px}
nav a.on{color:var(--gd)}
dialog{border:0;border-radius:18px;padding:20px;width:min(92vw,460px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select{font:inherit;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
small{color:var(--mute)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;max-width:88vw;z-index:20;display:none;font-size:16px}
.rules li{margin-bottom:8px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
.thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--gl);margin-bottom:10px;cursor:pointer}
.note{background:var(--gl);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:15px;word-break:break-word}
.sug{border:1.5px solid var(--line);border-radius:10px;margin-top:6px;max-height:240px;overflow:auto;background:var(--bg)}
.sug button{width:100%;justify-content:flex-start;background:transparent;color:var(--ink);border-radius:0;text-align:left;font-weight:500;border-bottom:1px solid var(--line)}
.sug button:hover{background:var(--gl)}
.sug img,.pick img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.pick{display:flex;align-items:center;gap:10px;background:var(--gl);border-radius:10px;padding:8px 12px;margin-top:8px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:15px}
.pv{margin-top:10px}
textarea{font:inherit;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="logo">Growly 🌱</div><div id="auth"></div></header>
<main id="app"></main>
<nav>
 <a href="#home" data-v="home"><span>🌿</span>बोर्ड</a>
 <a href="#helped" data-v="helped"><span>🤝</span>मेरी मदद</a>
 <a href="#profile" data-v="profile"><span>👤</span>प्रोफ़ाइल</a>
 <a href="#rules" data-v="rules"><span>📖</span>नियम</a>
</nav>
<div id="toast" role="status"></div>

<dialog id="dProfile"><form method="dialog" id="fProfile">
 <h2>आपका चैनल</h2><p class="sub">उसी Gmail से जुड़ें जिससे YouTube चैनल बना है।</p>
 <label>अपने चैनल का लिंक डालिए</label>
 <input id="pUrl" type="url" autocomplete="off" required placeholder="https://youtube.com/@aapkachannel">
 <div id="pPv" class="pv" hidden></div>
 <div id="manualBox" hidden>
  <label>चैनल का नाम</label><input id="pName" maxlength="60">
  <small>चैनल अपने-आप नहीं मिला, नाम यहाँ खुद लिख दीजिए।</small>
 </div>
 <label>विषय</label><input id="pTopic" maxlength="40" placeholder="जैसे: खाना, गेमिंग, पढ़ाई" required>
 <label>अंदाज़न subscribers</label>
 <select id="pSubs"><option>0–100</option><option>100–500</option><option>500–1,000</option><option>1,000–5,000</option><option>5,000+</option></select>
 <div class="row" style="margin-top:16px"><button type="button" class="ghost" onclick="dProfile.close()">रद्द</button><button>सेव करें</button></div>
</form></dialog>

<dialog id="dSos"><form method="dialog" id="fSos">
 <h2>अपना SOS लगाएँ</h2><p class="sub">24 घंटे बोर्ड पर दिखेगा। एक समय में एक ही।</p>
 <label>वीडियो का लिंक</label><input id="sUrl" type="url" placeholder="https://youtu.be/..." required>
 <div id="sPv" class="pv" hidden></div>
 <label>वीडियो का नाम</label><input id="sTitle" maxlength="80" required>
 <label>अपनी बात (चाहें तो)</label><textarea id="sNote" maxlength="120" rows="2" placeholder="जैसे: मदद कीजिए, सच्चा कमेंट कीजिए 🙏"></textarea>
 <small>youtube.com/watch, shorts या youtu.be ही चलेंगे।</small>
 <div class="row" style="margin-top:16px"><button type="button" class="ghost" onclick="dSos.close()">रद्द</button><button>SOS लगाएँ</button></div>
</form></dialog>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signInWithCredential,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,collection,query,where,getDocs,writeBatch,serverTimestamp,increment,Timestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyBcsuneNkMTbIK7gwqNlk4krGkFjhRKAkc",authDomain:"growly-974ce.firebaseapp.com",projectId:"growly-974ce",storageBucket:"growly-974ce.firebasestorage.app",messagingSenderId:"976715163266",appId:"1:976715163266:web:75983be3c978079201b69b"};
const DEFAULT_MIN_HELPS=3, HOUR=3600000;
// Google Cloud → APIs & Services → YouTube Data API v3 चालू करके API key बनाइए, और अपनी साइट के पते तक सीमित कीजिए
const YT_API_KEY="AIzaSyAxiBbGIR8dEy0B6hOeQlnAVX_t3FMU_lw";

const fb=initializeApp(firebaseConfig), auth=getAuth(fb), db=getFirestore(fb);
const $=id=>document.getElementById(id);
const S={user:null,profile:null,minHelps:DEFAULT_MIN_HELPS,sos:[],helpedIds:new Set(),helpedList:[],mySos:[],view:"home",loading:true};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const YT=/^https?:\/\/(www\.|m\.)?(youtube\.com\/(watch\?|shorts\/)|youtu\.be\/)\S+$/i;
const ms=t=>t?.toMillis?t.toMillis():0;
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",3800)}

async function loadAll(){
  S.loading=true;render();
  try{
    try{const c=await getDoc(doc(db,"config","settings"));if(c.exists())S.minHelps=c.data().minHelps??DEFAULT_MIN_HELPS}catch(e){}
    const snap=await getDocs(query(collection(db,"sos"),where("expiresAt",">",Timestamp.now())));
    S.sos=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.helpCount-b.helpCount)||(ms(b.createdAt)-ms(a.createdAt)));
    if(S.user){
      const h=await getDocs(collection(db,"users",S.user.uid,"helped"));
      S.helpedList=h.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));
      S.helpedIds=new Set(S.helpedList.map(x=>x.id));
      const m=await getDocs(query(collection(db,"sos"),where("ownerUid","==",S.user.uid)));
      S.mySos=m.docs.map(d=>({id:d.id,...d.data()}));
    }
  }catch(e){console.error(e);toast("लोड नहीं हो पाया। इंटरनेट देखकर दोबारा कोशिश कीजिए।")}
  S.loading=false;render();
}

onAuthStateChanged(auth,async u=>{
  S.user=u;S.profile=null;
  if(u){try{const p=await getDoc(doc(db,"users",u.uid));S.profile=p.exists()?p.data():null}catch(e){console.error(e)}}
  await loadAll();
  if(u&&!S.profile)openProfile();
});

// Firebase Console → Authentication → Sign-in method → Google → Web SDK configuration → "Web client ID" यहाँ चिपकाइए
const WEB_CLIENT_ID="976715163266-6nejv89bhvptscf3fdursohin3cve4g8.apps.googleusercontent.com";
const USE_GOOGLE_BUTTON=false; // true करने पर Google का अपना बटन चलेगा (Cloud Console में origin जोड़ना पड़ता है)
const useGsi=()=>USE_GOOGLE_BUTTON&&!WEB_CLIENT_ID.startsWith("PASTE");
function drawG(){
  if(!useGsi()||S.user)return;
  const el=$("gbtn");if(!el)return;
  if(!window.google?.accounts?.id){setTimeout(drawG,400);return}
  google.accounts.id.initialize({client_id:WEB_CLIENT_ID,callback:async r=>{
    try{await signInWithCredential(auth,GoogleAuthProvider.credential(r.credential))}
    catch(e){console.error(e);toast("Login नहीं हो पाया ("+(e.code||"error")+")")}}});
  google.accounts.id.renderButton(el,{theme:"filled_blue",size:"medium",text:"signin_with",shape:"pill"});
}
async function login(){
  if(useGsi()){scrollTo(0,0);toast("ऊपर वाले 'Sign in with Google' बटन से जुड़िए");return}
  const prov=new GoogleAuthProvider();
  const mobile=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
  try{
    await signInWithPopup(auth,prov);
  }catch(e){
    if(e.code==="auth/popup-closed-by-user"||e.code==="auth/cancelled-popup-request")return;
    if(e.code==="auth/popup-blocked"){try{await signInWithRedirect(auth,prov);return}catch(x){e=x}}
    console.error(e);toast("Login नहीं हो पाया ("+(e.code||"error")+")");
  }
}
getRedirectResult(auth).catch(e=>{console.error(e);toast("Login नहीं हो पाया ("+(e.code||"error")+")")});
async function logout(){await signOut(auth);toast("आप बाहर हो गए")}

function openProfile(){
  const p=S.profile||{};
  chInfo=p.channelName?{name:p.channelName,url:p.channelUrl,thumb:"",subs:p.subs}:null;
  $("pTopic").value=p.topic||"";$("pSubs").value=p.subs||"0–100";
  $("pUrl").value=p.channelUrl||"";$("pName").value=p.channelName||"";
  $("manualBox").hidden=true;$("pPv").hidden=true;
  if(p.channelUrl)previewChannel();
  dProfile.showModal();
}
$("fProfile").addEventListener("submit",async e=>{
  const man=!$("manualBox").hidden;
  const url=$("pUrl").value.trim(),name=((man?$("pName").value.trim():chInfo?.name)||""),topic=$("pTopic").value.trim(),subs=$("pSubs").value;
  if(!name){e.preventDefault();return toast("चैनल का नाम नहीं मिला, नीचे खुद लिख दीजिए")}
  if(!/^https?:\/\/(www\.|m\.)?youtube\.com\/\S+$/i.test(url)){e.preventDefault();return toast("चैनल का लिंक youtube.com का होना चाहिए")}
  if(!man&&chInfo?.url)e.target===undefined||0;
  try{
    const f={channelName:name.slice(0,60),channelUrl:(man?url:(chInfo?.url||url)),topic:topic.slice(0,40),subs,channelId:(man?"":chInfo?.id)||""};
    if(S.profile){await updateDoc(doc(db,"users",S.user.uid),f);Object.assign(S.profile,f)}
    else{
      const z=Timestamp.fromMillis(0);
      const n={...f,helpedCount:0,lastSosAt:z,activeUntil:z,createdAt:serverTimestamp()};
      await setDoc(doc(db,"users",S.user.uid),n);S.profile={...n,helpedCount:0,lastSosAt:z,activeUntil:z};
    }
    toast("प्रोफ़ाइल सेव हो गई ✅");render();
  }catch(err){console.error(err);toast("सेव नहीं हो पाया")}
});

let chInfo=null,pvT,chT,autoTitle="";const chCache={};
const hasKey=()=>!YT_API_KEY.startsWith("PASTE");
function vidId(u){try{const x=new URL(u),h=x.hostname.replace(/^(www\.|m\.)/,"");
  if(h==="youtu.be")return x.pathname.slice(1).split("/")[0]||null;
  if(h==="youtube.com"){if(x.pathname==="/watch")return x.searchParams.get("v");const m=x.pathname.match(/^\/shorts\/([\w-]+)/);if(m)return m[1]}}catch(e){}return null}
const thumb=u=>{const i=vidId(u);return i?`https://i.ytimg.com/vi/${i}/hqdefault.jpg`:""};
function subsBand(n){return n<100?"0–100":n<500?"100–500":n<1000?"500–1,000":n<5000?"1,000–5,000":"5,000+"}
function chHandle(u){try{const x=new URL(u.trim()),h=x.hostname.replace(/^(www\.|m\.)/,"");
  if(h!=="youtube.com")return null;
  const p=x.pathname.replace(/\/$/,"");
  if(/^\/@[^/]+$/.test(p))return{by:"forHandle",val:p.slice(1)};
  let m=p.match(/^\/channel\/([\w-]+)/);if(m)return{by:"id",val:m[1]};
  m=p.match(/^\/(c|user)\/([^/]+)/);if(m)return{by:m[1]==="user"?"forUsername":"forHandle",val:m[2]};
  return null;
}catch(e){return null}}
$("pUrl").addEventListener("input",()=>{clearTimeout(chT);chT=setTimeout(previewChannel,600)});
$("pUrl").addEventListener("blur",previewChannel);
async function previewChannel(){
  const raw=$("pUrl").value.trim(),pv=$("pPv");
  if(!/^https?:\/\/(www\.|m\.)?youtube\.com\/\S+$/i.test(raw)){pv.hidden=true;$("manualBox").hidden=true;return}
  const h=chHandle(raw);
  if(!h){pv.hidden=true;showManualCh(true);return}
  const key=h.by+":"+h.val;
  if(chCache[key])return drawCh(chCache[key],raw);
  pv.hidden=false;pv.innerHTML="<small>चैनल की जानकारी ला रहे हैं…</small>";
  if(!hasKey()){pv.innerHTML="<small>चैनल अपने-आप नहीं आ रहा, नीचे नाम खुद लिख दीजिए।</small>";showManualCh(true);return}
  try{
    let item=null;
    if(h.by==="id"){
      const r=await fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=${h.val}&key=${YT_API_KEY}`);
      const d=await r.json();if(!r.ok)throw d;item=d.items?.[0];
    }else{
      const param=h.by==="forUsername"?"forUsername":"forHandle";
      const r=await fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&${param}=${encodeURIComponent(h.val)}&key=${YT_API_KEY}`);
      const d=await r.json();if(!r.ok)throw d;item=d.items?.[0];
      if(!item){ // fallback: search by handle text
        const r2=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=channel&maxResults=1&q=${encodeURIComponent(h.val)}&key=${YT_API_KEY}`);
        const d2=await r2.json();const cid=d2.items?.[0]?.snippet?.channelId;
        if(cid){const r3=await fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=${cid}&key=${YT_API_KEY}`);const d3=await r3.json();item=d3.items?.[0]}
      }
    }
    if(!item)throw 0;
    const subs=item.statistics&&!item.statistics.hiddenSubscriberCount?+item.statistics.subscriberCount:null;
    const ch={id:item.id,name:item.snippet.title,thumb:item.snippet.thumbnails?.default?.url||"",subs};
    chCache[key]=ch;drawCh(ch,raw);
  }catch(e){console.error(e);pv.innerHTML="<small>चैनल अपने-आप नहीं मिला, नीचे नाम खुद लिख दीजिए।</small>";showManualCh(true)}
}
function showManualCh(on){$("manualBox").hidden=!on;if(on)$("pName").value=$("pName").value||""}
function drawCh(ch,url){
  chInfo={...ch,url};showManualCh(false);
  $("pPv").hidden=false;
  $("pPv").innerHTML=`<div class="pick">${ch.thumb?`<img alt="" src="${esc(ch.thumb)}">`:""}<div><b>${esc(ch.name)}</b>${ch.subs!=null?`<br><small>${ch.subs.toLocaleString("en-IN")} subscribers</small>`:""}</div></div>`;
  if(ch.subs!=null)$("pSubs").value=subsBand(ch.subs);
}

$("sUrl").addEventListener("input",()=>{clearTimeout(pvT);pvT=setTimeout(previewVideo,450)});
async function previewVideo(){
  const url=$("sUrl").value.trim(),pv=$("sPv");
  if(!YT.test(url)||!vidId(url)){pv.hidden=true;return}
  const img=`<img class="thumb" alt="" src="${esc(thumb(url))}">`;
  pv.hidden=false;pv.innerHTML=img+"<small>वीडियो की जानकारी ला रहे हैं…</small>";
  try{
    const r=await fetch("https://www.youtube.com/oembed?format=json&url="+encodeURIComponent(url));
    if(!r.ok)throw 0;const d=await r.json();
    const t=$("sTitle");if(!t.value.trim()||t.value===autoTitle){t.value=autoTitle=String(d.title).slice(0,80)}
    const mine=S.profile&&norm(d.author_name)===norm(S.profile.channelName);
    pv.innerHTML=img+`<b>${esc(d.title)}</b><br><small>${esc(d.author_name)}</small>`+(mine?"":`<div class="warnbox">यह वीडियो आपके चैनल "${esc(S.profile?.channelName)}" का नहीं दिख रहा। सिर्फ़ अपना वीडियो लगाइए।</div>`);
  }catch(e){pv.innerHTML=img+"<small>नाम अपने-आप नहीं आया, नीचे खुद लिख दीजिए।</small>"}
}

function needLogin(){if(!S.user){toast("पहले 'Google से जुड़ें' दबाइए");login();return true}if(!S.profile){openProfile();return true}return false}

function startSos(){
  if(needLogin())return;
  const p=S.profile,now=Date.now();
  if(p.helpedCount<S.minHelps)return toast(`पहले ${S.minHelps-p.helpedCount} और वीडियो को मदद कीजिए, फिर अपना SOS लगाइए`);
  if(ms(p.activeUntil)>now)return toast("आपका एक SOS अभी बोर्ड पर है। उसके हटने पर नया लगेगा");
  const wait=ms(p.lastSosAt)+12*HOUR-now;
  if(wait>0)return toast(`नया SOS ${Math.ceil(wait/HOUR)} घंटे बाद लग पाएगा`);
  $("sTitle").value="";$("sUrl").value="";$("sNote").value="";autoTitle="";$("sPv").hidden=true;dSos.showModal();
}
$("fSos").addEventListener("submit",async e=>{
  const title=$("sTitle").value.trim(),url=$("sUrl").value.trim();
  if(!YT.test(url)){e.preventDefault();return toast("सिर्फ़ YouTube का लिंक चलेगा")}
  try{
    const now=Date.now(),exp=Timestamp.fromMillis(now+24*HOUR),b=writeBatch(db),ref=doc(collection(db,"sos"));
    b.set(ref,{ownerUid:S.user.uid,title:title.slice(0,80),url,note:$("sNote").value.trim().slice(0,120),channelName:S.profile.channelName,helpCount:0,createdAt:serverTimestamp(),expiresAt:exp});
    b.update(doc(db,"users",S.user.uid),{lastSosAt:serverTimestamp(),activeUntil:exp});
    await b.commit();
    S.profile.lastSosAt=Timestamp.fromMillis(now);S.profile.activeUntil=exp;
    toast("आपका SOS बोर्ड पर लग गया 🌱");await loadAll();
  }catch(err){console.error(err);toast("SOS नहीं लग पाया। नियम दोबारा देख लीजिए")}
});

async function helped(id){
  if(needLogin())return;
  const s=S.sos.find(x=>x.id===id);if(!s)return;
  if(s.ownerUid===S.user.uid)return toast("अपने वीडियो को मदद नहीं गिनी जाती");
  if(!confirm("क्या आपने वीडियो देखा और सच्चा कमेंट किया?"))return;
  try{
    const b=writeBatch(db),u=S.user.uid;
    b.set(doc(db,"sos",id,"helps",u),{createdAt:serverTimestamp()});
    b.update(doc(db,"sos",id),{helpCount:increment(1)});
    b.update(doc(db,"users",u),{helpedCount:increment(1)});
    b.set(doc(db,"users",u,"helped",id),{title:s.title,url:s.url,channelName:s.channelName,createdAt:serverTimestamp()});
    await b.commit();
    S.profile.helpedCount++;toast("शुक्रिया! आपकी मदद गिन ली गई 💚");await loadAll();
  }catch(err){console.error(err);toast("नहीं हो पाया। शायद आप पहले ही मदद कर चुके हैं या SOS हट चुका है")}
}
async function report(type,id){
  if(!S.user)return toast("Report के लिए पहले जुड़िए");
  const r=prompt("क्या गलत है? (छोटे में लिखिए)");if(!r)return;
  try{await addDoc(collection(db,"reports"),{reporterUid:S.user.uid,type,targetId:id,reason:r.slice(0,200),createdAt:serverTimestamp()});toast("शिकायत भेज दी गई")}
  catch(e){toast("शिकायत नहीं जा पाई")}
}
window.G={login,logout,startSos,helped,report,openProfile,watch:id=>{const s=S.sos.find(x=>x.id===id)||S.helpedList.find(x=>x.id===id);if(s)window.open(s.url,"_blank","noopener")}};

function card(s){
  const left=Math.max(1,Math.ceil((ms(s.expiresAt)-Date.now())/HOUR)),mine=S.user&&s.ownerUid===S.user.uid,done=S.helpedIds.has(s.id);
  return `<article class="card ${mine?"mine":s.helpCount===0?"need":""}">
   ${thumb(s.url)?`<img class="thumb" loading="lazy" alt="" src="${esc(thumb(s.url))}" onclick="G.watch('${s.id}')">`:""}
   <h3>${esc(s.title)}</h3><p class="meta">${esc(s.channelName)}</p>${s.note?`<p class="note">${esc(s.note)}</p>`:""}
   <div class="chips"><span class="chip ${s.helpCount===0?"w":""}">${s.helpCount===0?"अभी तक कोई मदद नहीं":"मदद मिली: "+s.helpCount}</span><span class="chip">⏳ ${left} घंटे बचे</span></div>
   <div class="row"><button class="ghost" onclick="G.watch('${s.id}')">▶ वीडियो देखें</button>
   ${mine?`<button disabled>आपका वीडियो</button>`:done?`<button disabled>✅ मदद हो चुकी</button>`:`<button onclick="G.helped('${s.id}')">मैंने मदद की</button>`}</div>
   <button class="link" onclick="G.report('sos','${s.id}')">⚑ Report</button></article>`;
}

function render(){
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===S.view));
  $("auth").innerHTML=S.user?`<button class="ghost tiny" onclick="G.logout()">बाहर</button>`:(useGsi()?`<div id="gbtn"></div>`:`<button class="tiny" onclick="G.login()">Google से जुड़ें</button>`);drawG();
  const A=$("app"),p=S.profile;
  if(S.view==="home"){
    A.innerHTML=`<h2>SOS बोर्ड</h2><p class="sub">जिसे अभी सबसे कम सहारा मिला है, वह सबसे ऊपर। देखिए, सच्चा कमेंट कीजिए, सहारा दीजिए।</p>
     <button class="big" onclick="G.startSos()">🌱 SOS लगाएँ</button>`+
     (S.loading?`<div class="empty">लोड हो रहा है…</div>`:S.sos.length?S.sos.map(card).join(""):`<div class="empty">अभी बोर्ड खाली है।<br>पहला SOS आप लगाइए!</div>`);
  }else if(S.view==="helped"){
    A.innerHTML=`<h2>मेरी मदद की सूची</h2><p class="sub">जिन वीडियो को आपने सहारा दिया।</p>`+
     (!S.user?`<div class="empty">देखने के लिए जुड़िए।</div>`:S.helpedList.length?S.helpedList.map(h=>`<article class="card">${thumb(h.url)?`<img class="thumb" loading="lazy" alt="" src="${esc(thumb(h.url))}" onclick="G.watch('${h.id}')">`:""}<h3>${esc(h.title)}</h3><p class="meta">${esc(h.channelName)}</p><button class="ghost tiny" onclick="G.watch('${h.id}')">▶ वीडियो देखें</button></article>`).join(""):`<div class="empty">अभी तक कोई मदद नहीं की। बोर्ड से शुरू कीजिए।</div>`);
  }else if(S.view==="profile"){
    if(!S.user){A.innerHTML=`<h2>मेरी प्रोफ़ाइल</h2><div class="empty">देखने के लिए जुड़िए।<br><br><button onclick="G.login()">Google से जुड़ें</button></div>`;return}
    const recv=S.mySos.reduce((n,x)=>n+(x.helpCount||0),0),need=Math.max(0,S.minHelps-(p?.helpedCount||0));
    A.innerHTML=`<h2>मेरी प्रोफ़ाइल</h2>`+(p?`<div class="sec"><b>${esc(p.channelName)}</b><br><a href="${esc(p.channelUrl)}" target="_blank" rel="noopener">${esc(p.channelUrl)}</a><br><small>विषय: ${esc(p.topic)} · Subscribers: ${esc(p.subs)}</small><br><br>
      <button class="ghost tiny" onclick="G.openProfile()">बदलें</button></div>
      <div class="stats"><div class="stat"><b>${p.helpedCount||0}</b>मैंने मदद की</div><div class="stat"><b>${recv}</b>मुझे मदद मिली</div></div>
      <div class="sec">${need?`अपना SOS लगाने के लिए ${need} और वीडियो को मदद कीजिए।`:"आप अपना SOS लगा सकते हैं ✅"}</div>`:`<div class="empty"><button onclick="G.openProfile()">प्रोफ़ाइल बनाएँ</button></div>`);
  }else{
    A.innerHTML=`<h2>सहायता और नियम</h2><div class="sec"><b>Growly कैसे काम करता है</b><ol class="rules">
     <li>बोर्ड से कोई वीडियो खोलिए और पूरा देखिए।</li><li>दिल से, सच्चा कमेंट कीजिए।</li><li>"मैंने मदद की" दबाइए।</li>
     <li>${S.minHelps} वीडियो को मदद करने के बाद अपना SOS लगाइए।</li></ol>
     जिस वीडियो को सबसे कम सहारा मिला है, वह सबसे ऊपर दिखता है।</div>
     <div class="sec"><b>नियम</b><ul class="rules"><li>एक समय में एक ही SOS, और हर 12 घंटे में सिर्फ़ एक नया।</li><li>हर SOS 24 घंटे बाद अपने-आप हट जाता है।</li><li>हर वीडियो को एक व्यक्ति सिर्फ़ एक बार मदद गिनवा सकता है; अपने वीडियो को नहीं।</li><li>सिर्फ़ YouTube लिंक (watch, shorts, youtu.be)।</li><li>वीडियो का नाम 80 और चैनल का नाम 60 अक्षर तक।</li></ul></div>
     <div class="sec"><b>क्या करना मना है</b><ul class="rules"><li>नकली या कॉपी किया हुआ कमेंट, सिर्फ़ "nice video" जैसा बेमतलब कमेंट।</li><li>पैसे या इनाम देकर किसी से subscribe या कमेंट कराना।</li><li>नकली चैनल या किसी और का चैनल अपना बताना।</li><li>गलत या नकली SOS दिखे तो ⚑ Report दबाइए।</li></ul></div>`;
  }
}
const route=()=>{S.view=(location.hash||"#home").slice(1);if(!["home","helped","profile","rules"].includes(S.view))S.view="home";render();scrollTo(0,0)};
addEventListener("hashchange",route);route();
</script>
</body>
</html>
